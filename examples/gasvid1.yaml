# Static-region mask + fixed mean background, previewed in a window.
# Reproduces the original hardcoded gasvid_0.py pipeline exactly.
name: baseline

source:
  type: video
  path: inputs/gasvid1.mp4

stages:
  - {type: gray}
  - {type: mean_background, n_frames: 90}
  - {type: static_mask}
  - {type: apply_mask}
  - {type: static_mask}
  - {type: apply_mask, fill: 255, name: masked}

sinks:
  - {type: display, size: [640, 480]}
  - {type: ffmpeg, path: outputs/gasvid1.mp4}

