[project]
name = "segmentator"
version = "0.5.1"
description = "Configuration-driven image and video segmentation pipelines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
]

[project.optional-dependencies]
# The editor only. A headless install — a batch box, CI — never pulls Qt in.
gui = ["pyqt6>=6.7", "ruamel.yaml>=0.18"]

[project.scripts]
segmentator = "cli:main"
segmentator-gui = "segmentator.gui.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
build = ["pyinstaller>=6.11"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.commitizen]
# "uv" provider (not "pep621"): bumps [project].version *and* refreshes uv.lock's
# recorded package version in the same step — see .github/workflows/bump-version.yml.
version_provider = "uv"
tag_format = "v$version"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["segmentator*"]

# The app icon, which the launcher window shows. It has to live inside the
# package rather than in `packaging/`: setuptools cannot carry data from
# outside a package, and a wheel install has no `packaging/` to read.
[tool.setuptools.package-data]
"segmentator.gui" = ["assets/*.png"]
