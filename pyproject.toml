[project]
name = "segmentator"
version = "0.1.0"
description = "Configuration-driven image and video segmentation pipelines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
]

[project.scripts]
segmentator = "cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["segmentator*"]
