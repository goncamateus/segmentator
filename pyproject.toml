[project]
name = "segmentator"
version = "0.1.0"
description = "Configuration-driven image and video segmentation pipelines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
]

[project.optional-dependencies]
# The editor only. A headless install — a batch box, CI — never pulls Qt in.
gui = ["pyqt6>=6.7", "ruamel.yaml>=0.18"]

[project.scripts]
segmentator = "cli:main"
segmentator-gui = "segmentator.gui.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
build = ["pyinstaller>=6.11"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["segmentator*"]
