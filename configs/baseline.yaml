# Static-region mask + fixed mean background, previewed in a window.
# Reproduces the original hardcoded gasvid_0.py pipeline exactly.
name: baseline

source:
  type: video
  path: inputs/gasvid.mp4

stages:
  - {type: gray}

  # `name` taps this stage's output so a sink can write the mid-chain frame.
  - {type: median_blur, ksize: 7, name: smoothed}

  # Fitted once on the first smoothed frame; selects the dark region of interest
  # and publishes it for the stages below. It leaves the frame itself untouched,
  # so the mask is reached as `input: mask`, not by naming this stage.
  - {type: static_mask, threshold: 127, invert: true}

  # Averages the first 60 masked frames, then subtracts that mean from every frame.
  - {type: mean_background, n_frames: 60, use_mask: true}
  - {type: apply_mask, fill: 0, name: masked}

  # tozero keeps the magnitude of pixels above the level and zeroes the rest;
  # tozero_inv then clips near-saturated pixels (reflections) back to zero.
  - {type: threshold, value: 15, mode: tozero}
  - {type: threshold, value: 200, mode: tozero_inv}

sinks:
  # Without `input`, a sink gets the chain's final image.
  - {type: display, size: [640, 480]}
  - {type: ffmpeg, path: outputs/gasvid.mp4}

  # Uncomment to compare against the raw footage, a mid-chain frame or the ROI mask.
  # Each display sink gets its own window, titled after its `input` by default.
  # - {type: display, input: source, size: [640, 480]}
  # - {type: display, input: smoothed, size: [640, 480]}
  # - {type: display, input: mask, size: [640, 480]}
