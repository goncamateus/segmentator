<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>The same pipeline in a plain list-and-form editor</title>
  <defs>
    <linearGradient id="l-plume" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#12161c"/><stop offset="55%" stop-color="#3d4a5c"/><stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="460" fill="#f5f7fa"/>
  <rect x="0" y="0" width="900" height="34" fill="#fff"/><line y1="34" x2="900" y2="34" stroke="#cbd2d9"/>
  <text x="16" y="22" font-size="13" fill="#3e4c59" font-weight="600">motion.yaml</text>
  <text x="130" y="22" font-size="12" fill="#7b8794">frame 412 / 1800</text>

  <!-- stage list -->
  <g transform="translate(16 50)">
    <rect width="232" height="394" rx="6" fill="#fff" stroke="#cbd2d9"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#3e4c59">Stages</text>
    <text x="200" y="22" font-size="14" fill="#1f6feb">+</text>
    <g font-size="11">
      <rect x="8" y="34" width="216" height="28" rx="4" fill="#f5f7fa"/>
      <text x="20" y="52" fill="#52606d">⋮⋮  gray</text>
      <rect x="8" y="66" width="216" height="28" rx="4" fill="#f5f7fa"/>
      <text x="20" y="84" fill="#52606d">⋮⋮  gaussian_blur</text>
      <rect x="8" y="98" width="216" height="28" rx="4" fill="#e3f0ff" stroke="#1f6feb"/>
      <text x="20" y="116" fill="#1f2933" font-weight="600">⋮⋮  farneback</text>
      <rect x="150" y="103" width="42" height="16" rx="8" fill="#f0b429"/>
      <text x="156" y="115" font-size="9" fill="#5c3d00">flow</text>
      <rect x="8" y="130" width="216" height="28" rx="4" fill="#f5f7fa"/>
      <text x="20" y="148" fill="#52606d">⋮⋮  motion_heat</text>
      <rect x="8" y="162" width="216" height="28" rx="4" fill="#f5f7fa"/>
      <text x="20" y="180" fill="#52606d">⋮⋮  threshold</text>
      <rect x="8" y="194" width="216" height="28" rx="4" fill="#f5f7fa"/>
      <text x="20" y="212" fill="#52606d">⋮⋮  morphology</text>
      <rect x="150" y="199" width="46" height="16" rx="8" fill="#f0b429"/>
      <text x="156" y="211" font-size="9" fill="#5c3d00">mask</text>
      <rect x="8" y="226" width="216" height="28" rx="4" fill="#f5f7fa"/>
      <text x="20" y="244" fill="#52606d">⋮⋮  motion_objects</text>
    </g>
    <line x1="8" y1="268" x2="224" y2="268" stroke="#e4e7eb"/>
    <text x="12" y="288" font-size="12" font-weight="600" fill="#3e4c59">Sinks</text>
    <text x="200" y="288" font-size="14" fill="#1f6feb">+</text>
    <g font-size="11">
      <rect x="8" y="298" width="216" height="28" rx="4" fill="#eafaf3"/>
      <text x="20" y="316" fill="#1f8a70">ffmpeg  ← image</text>
      <rect x="8" y="330" width="216" height="28" rx="4" fill="#eafaf3"/>
      <text x="20" y="348" fill="#1f8a70">ffmpeg  ← mask</text>
      <rect x="8" y="362" width="216" height="28" rx="4" fill="#eafaf3"/>
      <text x="20" y="380" fill="#1f8a70">csv     ← rows</text>
    </g>
  </g>

  <!-- param form -->
  <g transform="translate(264 50)">
    <rect width="220" height="394" rx="6" fill="#fff" stroke="#cbd2d9"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#3e4c59">farneback</text>
    <text x="12" y="40" font-size="10" fill="#7b8794">generated from the signature</text>
    <g font-size="11">
      <text x="12" y="70" fill="#7b8794">pyr_scale</text>
      <rect x="12" y="76" width="196" height="22" rx="3" fill="#f5f7fa" stroke="#cbd2d9"/><text x="20" y="91" fill="#1f2933">0.5</text>
      <text x="12" y="118" fill="#7b8794">levels</text>
      <rect x="12" y="124" width="196" height="22" rx="3" fill="#f5f7fa" stroke="#cbd2d9"/><text x="20" y="139" fill="#1f2933">3</text>
      <text x="12" y="166" fill="#7b8794">winsize</text>
      <rect x="12" y="172" width="196" height="22" rx="3" fill="#f5f7fa" stroke="#cbd2d9"/><text x="20" y="187" fill="#1f2933">21</text>
      <text x="12" y="214" fill="#7b8794">iterations</text>
      <rect x="12" y="220" width="196" height="22" rx="3" fill="#f5f7fa" stroke="#cbd2d9"/><text x="20" y="235" fill="#1f2933">3</text>
      <text x="12" y="262" fill="#b44d12" font-weight="600">gain</text>
      <rect x="12" y="268" width="196" height="22" rx="3" fill="#fdf3d8" stroke="#f0b429"/><text x="20" y="283" fill="#1f2933">160</text>
      <text x="12" y="306" fill="#7b8794">name (tap)</text>
      <rect x="12" y="312" width="196" height="22" rx="3" fill="#f5f7fa" stroke="#cbd2d9"/><text x="20" y="327" fill="#1f2933">flow</text>
    </g>
  </g>

  <!-- preview -->
  <g transform="translate(500 50)">
    <rect width="384" height="394" rx="6" fill="#fff" stroke="#cbd2d9"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#3e4c59">Preview</text>
    <g font-size="10">
      <rect x="90" y="10" width="52" height="16" rx="8" fill="#1f6feb"/><text x="98" y="22" fill="#fff">selected</text>
      <rect x="148" y="10" width="40" height="16" rx="8" fill="#e4e7eb"/><text x="156" y="22" fill="#52606d">source</text>
      <rect x="194" y="10" width="40" height="16" rx="8" fill="#e4e7eb"/><text x="202" y="22" fill="#52606d">mask</text>
    </g>
    <rect x="12" y="36" width="360" height="230" fill="url(#l-plume)"/>
    <rect x="150" y="140" width="70" height="52" fill="none" stroke="#f0b429" stroke-width="2"/>
    <text x="150" y="134" font-size="10" fill="#f0b429">3640px 2.9/f</text>
    <g font-size="11">
      <text x="12" y="292" fill="#3e4c59" font-weight="600">metrics</text>
      <text x="12" y="312" fill="#7b8794">motion_px</text><text x="180" y="312" fill="#1f2933" text-anchor="end">270</text>
      <text x="12" y="330" fill="#7b8794">motion_frac</text><text x="180" y="330" fill="#1f2933" text-anchor="end">0.0035</text>
      <text x="12" y="348" fill="#7b8794">motion_objects</text><text x="180" y="348" fill="#1f2933" text-anchor="end">1</text>
      <text x="12" y="366" fill="#7b8794">motion_speed</text><text x="180" y="366" fill="#1f2933" text-anchor="end">2.9</text>
    </g>
    <rect x="12" y="380" width="360" height="6" rx="3" fill="#e4e7eb"/>
    <rect x="12" y="380" width="82" height="6" rx="3" fill="#1f6feb"/>
  </g>
</svg>
