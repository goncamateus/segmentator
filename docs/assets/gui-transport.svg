<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>What happens when a knob moves while the preview is paused</title>
  <defs>
    <marker id="t-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
    <marker id="t-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b44d12"/>
    </marker>
  </defs>
  <rect width="920" height="470" fill="#f5f7fa"/>

  <text x="24" y="28" font-size="13" font-weight="600" fill="#3e4c59">You drag `threshold.value` on the frame that is already on screen</text>

  <!-- chain -->
  <g transform="translate(24 52)" font-size="10">
    <g>
      <rect width="104" height="34" rx="5" fill="#eef1f5" stroke="#cbd2d9"/><text x="14" y="21" fill="#7b8794">1  gray</text>
      <rect x="116" width="104" height="34" rx="5" fill="#eef1f5" stroke="#cbd2d9"/><text x="130" y="21" fill="#7b8794">2  gaussian_blur</text>
      <rect x="232" width="104" height="34" rx="5" fill="#eef1f5" stroke="#cbd2d9"/><text x="246" y="21" fill="#7b8794">3  farneback</text>
      <circle cx="326" cy="9" r="4" fill="#f0b429"/>
      <rect x="348" width="104" height="34" rx="5" fill="#eef1f5" stroke="#cbd2d9"/><text x="362" y="21" fill="#7b8794">4  motion_heat</text>
      <circle cx="442" cy="9" r="4" fill="#f0b429"/>
      <rect x="464" width="104" height="34" rx="5" fill="#e3f0ff" stroke="#1f6feb" stroke-width="1.5"/><text x="478" y="21" fill="#1f2933" font-weight="600">5  threshold</text>
      <rect x="580" width="104" height="34" rx="5" fill="#fff" stroke="#9aa5b1"/><text x="594" y="21" fill="#3e4c59">6  morphology</text>
      <rect x="696" width="120" height="34" rx="5" fill="#fdf3d8" stroke="#f0b429" stroke-width="1.5"/><text x="710" y="21" fill="#5c3d00">7  motion_objects</text>
      <circle cx="806" cy="9" r="4" fill="#f0b429"/>
    </g>
  </g>

  <path d="M24 100 H508" stroke="#9aa5b1" stroke-width="1.2" fill="none"/>
  <path d="M24 100 V94 M508 100 V94" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="24" y="118" font-size="11" fill="#52606d">served from the prefix cache — not re-run, so the flow model above never sees this frame twice</text>

  <path d="M512 128 H840" stroke="#1f6feb" stroke-width="1.2" fill="none"/>
  <path d="M512 128 V122 M840 128 V122" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="512" y="146" font-size="11" fill="#1f6feb">re-run from the edit down</text>

  <!-- the three rules -->
  <g transform="translate(24 168)">
    <rect width="280" height="126" rx="6" fill="#fff" stroke="#cbd2d9"/>
    <text x="14" y="24" font-size="11" font-weight="600" fill="#3e4c59">1 · the same frame, twice</text>
    <text x="14" y="44" font-size="10" fill="#52606d">Feeding MOG2 the frame on screen fifty times</text>
    <text x="14" y="58" font-size="10" fill="#52606d">while you tune teaches it that the plume is</text>
    <text x="14" y="72" font-size="10" fill="#52606d">the background — it fades out as you work.</text>
    <text x="14" y="94" font-size="10" fill="#1f8a70">The cache above the edit is the answer; a stage</text>
    <text x="14" y="108" font-size="10" fill="#1f8a70">below it that remembers gets a fresh instance.</text>
  </g>
  <g transform="translate(320 168)">
    <rect width="280" height="126" rx="6" fill="#fff" stroke="#cbd2d9"/>
    <text x="14" y="24" font-size="11" font-weight="600" fill="#3e4c59">2 · a jump</text>
    <text x="14" y="44" font-size="10" fill="#52606d">Seek, or step backwards, and the previous</text>
    <text x="14" y="58" font-size="10" fill="#52606d">frame is no longer the previous frame.</text>
    <text x="14" y="72" font-size="10" fill="#52606d">Differencing across the jump lights up the</text>
    <text x="14" y="86" font-size="10" fill="#52606d">whole image.</text>
    <text x="14" y="108" font-size="10" fill="#1f8a70">Every stage that remembers is rebuilt.</text>
  </g>
  <g transform="translate(616 168)">
    <rect width="280" height="126" rx="6" fill="#fff" stroke="#cbd2d9"/>
    <text x="14" y="24" font-size="11" font-weight="600" fill="#3e4c59">3 · a changed model</text>
    <text x="14" y="44" font-size="10" fill="#52606d">`history`, `lag`, `n_frames` are baked in at</text>
    <text x="14" y="58" font-size="10" fill="#52606d">construction. They cannot be assigned, so the</text>
    <text x="14" y="72" font-size="10" fill="#52606d">stage is rebuilt and starts over.</text>
    <text x="14" y="94" font-size="10" fill="#1f8a70">Per-frame knobs stay live, which is what lets a</text>
    <text x="14" y="108" font-size="10" fill="#1f8a70">paused frame re-render as you drag them.</text>
  </g>

  <!-- warm-up -->
  <g transform="translate(24 314)">
    <rect width="872" height="132" rx="6" fill="#fff" stroke="#f0b429"/>
    <text x="16" y="26" font-size="12" font-weight="600" fill="#b44d12">…and then the warm-up replay</text>
    <text x="16" y="48" font-size="11" fill="#52606d">A stage that just restarted has no previous frame, and would paint black under your hands. So the eight frames</text>
    <text x="16" y="64" font-size="11" fill="#52606d">before this one are pushed back through the chain — but only as far as the last stage that remembers anything,</text>
    <text x="16" y="80" font-size="11" fill="#52606d">because everything below it is a pure function of the frame it is handed and has nothing to warm.</text>
    <g transform="translate(16 92)" font-size="9">
      <g fill="#eef1f5" stroke="#cbd2d9">
        <rect width="28" height="22" rx="3"/><rect x="34" width="28" height="22" rx="3"/><rect x="68" width="28" height="22" rx="3"/>
        <rect x="102" width="28" height="22" rx="3"/><rect x="136" width="28" height="22" rx="3"/><rect x="170" width="28" height="22" rx="3"/>
        <rect x="204" width="28" height="22" rx="3"/><rect x="238" width="28" height="22" rx="3"/>
      </g>
      <rect x="278" width="28" height="22" rx="3" fill="#e3f0ff" stroke="#1f6feb"/>
      <text x="4" y="15" fill="#7b8794">−8</text><text x="242" y="15" fill="#7b8794">−1</text><text x="284" y="15" fill="#1f6feb">now</text>
      <path d="M266 11 H274" stroke="#b44d12" stroke-width="1.4" marker-end="url(#t-warm)"/>
      <text x="320" y="15" font-size="10" fill="#b44d12">replayed, not painted — then the current frame is drawn once</text>
      <text x="320" y="30" font-size="10" fill="#7b8794">Eight frames does nothing for `mog2 history: 500`, which is why the status bar names what reset.</text>
    </g>
  </g>
</svg>
