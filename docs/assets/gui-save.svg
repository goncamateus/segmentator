<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>What a save does to a hand-written config</title>
  <defs>
    <marker id="y-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
  </defs>
  <rect width="920" height="320" fill="#f5f7fa"/>
  <text x="24" y="26" font-size="13" font-weight="600" fill="#3e4c59">You changed one number. That is all the file should say happened.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="24" y="52" font-family="system-ui" font-size="11" font-weight="600" fill="#7b8794">configs/motion.yaml, as written by hand</text>
    <rect x="24" y="62" width="392" height="150" rx="6" fill="#1f2933"/>
    <text x="38" y="84" fill="#616e7c"># gain is a calibration constant: this plume</text>
    <text x="38" y="100" fill="#616e7c"># drifts under ~1.5 px/frame, which at the</text>
    <text x="38" y="116" fill="#616e7c"># default gain of 32 is erased by the open.</text>
    <text x="38" y="140" fill="#e8eef5">- {type: farneback, winsize: 21, gain: 160,</text>
    <text x="38" y="156" fill="#e8eef5">   name: flow}</text>
    <text x="38" y="180" fill="#616e7c"># The rolling average, for the overlay.</text>
    <text x="38" y="196" fill="#e8eef5">- {type: motion_heat, window: 20}</text>

    <text x="504" y="52" font-family="system-ui" font-size="11" font-weight="600" fill="#7b8794">the same file after File ▸ Save</text>
    <rect x="504" y="62" width="392" height="150" rx="6" fill="#1f2933"/>
    <text x="518" y="84" fill="#616e7c"># gain is a calibration constant: this plume</text>
    <text x="518" y="100" fill="#616e7c"># drifts under ~1.5 px/frame, which at the</text>
    <text x="518" y="116" fill="#616e7c"># default gain of 32 is erased by the open.</text>
    <text x="518" y="140" fill="#e8eef5">- {type: farneback, winsize: 21, </text>
    <text x="762" y="140" fill="#f0b429">gain: 210</text>
    <text x="836" y="140" fill="#e8eef5">,</text>
    <text x="518" y="156" fill="#e8eef5">   name: flow}</text>
    <text x="518" y="180" fill="#616e7c"># The rolling average, for the overlay.</text>
    <text x="518" y="196" fill="#e8eef5">- {type: motion_heat, window: 20}</text>
  </g>

  <path d="M424 138 H496" stroke="#7b8794" stroke-width="1.6" fill="none" marker-end="url(#y-arrow)"/>
  <text x="430" y="128" font-size="10" fill="#7b8794">ruamel round-trip</text>

  <g transform="translate(24 236)">
    <rect width="436" height="62" rx="6" fill="#fff" stroke="#1f8a70"/>
    <text x="16" y="24" font-size="11" font-weight="600" fill="#1f8a70">Kept: comments, key order, quoting, flow style</text>
    <text x="16" y="44" font-size="11" fill="#52606d">`git diff` after a save shows the line you changed and</text>
    <text x="16" y="58" font-size="11" fill="#52606d">nothing else. The tests assert exactly that.</text>
  </g>
  <g transform="translate(484 236)">
    <rect width="412" height="62" rx="6" fill="#fff" stroke="#f0b429"/>
    <text x="16" y="24" font-size="11" font-weight="600" fill="#b44d12">The one exception: reordering</text>
    <text x="16" y="44" font-size="11" fill="#5c3d00">A comment block sitting between two stages belongs to</text>
    <text x="16" y="58" font-size="11" fill="#5c3d00">whichever one it was attached to. Moving that stage moves it.</text>
  </g>
</svg>
