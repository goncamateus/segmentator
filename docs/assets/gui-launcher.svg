<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" width="700" height="640" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>The launcher: what opens when no config was named — the icon and version, and the two ways in</title>
  <defs>
    <linearGradient id="l-mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b21b6"/><stop offset="45%" stop-color="#1f6feb"/><stop offset="100%" stop-color="#4fd1a5"/>
    </linearGradient>
    <clipPath id="l-tile"><rect x="94" y="160" width="256" height="256" rx="56"/></clipPath>
  </defs>
  <rect width="700" height="640" fill="#f5f7fa"/>

  <!-- window chrome. The client area is 640x500 — the one window in the editor
       that fixes its own size, because nothing on it can grow. -->
  <path d="M 30 48 v -22 a 6 6 0 0 1 6 -6 h 628 a 6 6 0 0 1 6 6 v 22 z" fill="#f5f7fa" stroke="#cbd2d9"/>
  <text x="350" y="40" font-size="11" fill="#7b8794" text-anchor="middle">segmentator</text>
  <path d="M 30 48 v 494 a 6 6 0 0 0 6 6 h 628 a 6 6 0 0 0 6 -6 v -494 z" fill="#ffffff" stroke="#cbd2d9"/>

  <!-- The seam between the halves: a 1px frame filled with {rule}, not a
       QFrame.Shape.VLine — Fusion paints that as a two-tone groove out of the
       desktop palette, in a different grey from every other seam here. -->
  <line x1="410" y1="59" x2="410" y2="537" stroke="#e4e7eb"/>

  <!-- left: the app icon, rounded to the corner the platforms round it to anyway -->
  <g clip-path="url(#l-tile)">
    <rect x="94" y="160" width="256" height="256" fill="#0b0e12"/>
    <circle cx="222" cy="288" r="94" fill="url(#l-mark)"/>
    <circle cx="222" cy="288" r="43" fill="#12161c"/>
    <circle cx="209" cy="274" r="12" fill="#ffffff"/>
  </g>

  <!-- version, bottom left, in the {muted} that the QLabel#hint rule paints -->
  <text x="54" y="528" font-size="12" fill="#7b8794">version: 0.1.0</text>

  <!-- right: the two ways in. Stock QPushButtons — {ground} on a {border},
       radius 4, straight out of the global sheet. -->
  <g font-size="12">
    <rect x="458" y="264" width="160" height="30" rx="4" fill="#f5f7fa" stroke="#cbd2d9"/>
    <text x="538" y="283" fill="#3e4c59" text-anchor="middle">New Project</text>
    <rect x="458" y="306" width="160" height="30" rx="4" fill="#f5f7fa" stroke="#cbd2d9"/>
    <text x="538" y="325" fill="#3e4c59" text-anchor="middle">Open Project</text>
  </g>

  <!-- legend -->
  <g transform="translate(30 574)" font-size="11">
    <rect x="0" y="0" width="14" height="14" rx="4" fill="#f5f7fa" stroke="#cbd2d9"/>
    <text x="22" y="11" fill="#52606d"><tspan font-weight="600" fill="#3e4c59">New Project</tspan> asks for a video, writes a first config from it, and opens the editor on it — a preview already running.</text>
    <rect x="0" y="22" width="14" height="14" rx="4" fill="#f5f7fa" stroke="#cbd2d9"/>
    <text x="22" y="33" fill="#52606d"><tspan font-weight="600" fill="#3e4c59">Open Project</tspan> is the file picker this window replaced. Backing out of either dialog comes back here rather than quitting.</text>
    <text x="0" y="55" fill="#52606d">Named a config on the command line — <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3e4c59">segmentator-gui configs/motion.yaml</tspan> — and the launcher is skipped entirely.</text>
  </g>
</svg>
