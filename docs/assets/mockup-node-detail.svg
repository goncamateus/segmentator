<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>One node close up: title, thumbnail, parameters, ports, tap badge</title>
  <defs>
    <linearGradient id="d-heat" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#0b1a3a"/><stop offset="45%" stop-color="#1f8a70"/><stop offset="80%" stop-color="#e8b53a"/><stop offset="100%" stop-color="#d94f34"/>
    </linearGradient>
    <marker id="lead" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <circle cx="3" cy="5" r="2.5" fill="#b44d12"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#f5f7fa"/>

  <g transform="translate(60 60)">
    <rect width="300" height="270" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="2.5"/>
    <rect width="300" height="34" rx="10" fill="#1f6feb"/><rect y="20" width="300" height="14" fill="#1f6feb"/>
    <text x="16" y="23" font-size="14" fill="#fff" font-weight="600">farneback</text>
    <circle cx="278" cy="17" r="6" fill="#8fd14f"/>

    <rect x="200" y="-16" width="100" height="20" rx="10" fill="#f0b429"/>
    <text x="212" y="-2" font-size="11" fill="#5c3d00" font-weight="600">tap: flow</text>

    <rect x="16" y="48" width="140" height="88" fill="url(#d-heat)" stroke="#cbd2d9"/>
    <text x="16" y="150" font-size="10" fill="#7b8794">live · 160×96 · 4 fps</text>

    <g font-size="11">
      <text x="172" y="62" fill="#7b8794">pyr_scale</text><text x="266" y="62" fill="#1f2933" text-anchor="end">0.5</text>
      <text x="172" y="82" fill="#7b8794">levels</text><text x="266" y="82" fill="#1f2933" text-anchor="end">3</text>
      <text x="172" y="102" fill="#7b8794">winsize</text><text x="266" y="102" fill="#1f2933" text-anchor="end">21</text>
      <text x="172" y="122" fill="#7b8794">iterations</text><text x="266" y="122" fill="#1f2933" text-anchor="end">3</text>
      <text x="172" y="142" fill="#b44d12" font-weight="600">gain</text><text x="266" y="142" fill="#b44d12" text-anchor="end" font-weight="600">160</text>
    </g>
    <rect x="168" y="130" width="102" height="16" rx="3" fill="none" stroke="#f0b429" stroke-dasharray="3 2"/>

    <line x1="16" y1="166" x2="284" y2="166" stroke="#e4e7eb"/>
    <text x="16" y="186" font-size="11" fill="#3e4c59" font-weight="600">state carried across frames</text>
    <text x="16" y="204" font-size="10" fill="#7b8794">_history.prev — invalidated on a shape change,</text>
    <text x="16" y="218" font-size="10" fill="#7b8794">and on any edit that rebuilds this node.</text>

    <rect x="16" y="230" width="268" height="26" rx="4" fill="#fdf3d8" stroke="#f0b429"/>
    <text x="26" y="247" font-size="10" fill="#7c5c00">editing a parameter here resets the flow model</text>

    <circle cx="0" cy="120" r="7" fill="#9aa5b1" stroke="#52606d" stroke-width="1.5"/>
    <text x="-46" y="124" font-size="10" fill="#7b8794">in</text>
    <circle cx="300" cy="120" r="7" fill="#f0b429" stroke="#8a5a00" stroke-width="1.5"/>
    <text x="314" y="124" font-size="10" fill="#7b8794">out</text>
  </g>

  <g stroke="#b44d12" stroke-width="1.2" fill="none" marker-start="url(#lead)">
    <path d="M368 200 L440 200"/>
    <path d="M368 108 L440 78"/>
    <path d="M368 44 L440 30"/>
  </g>

  <g font-size="11" fill="#3e4c59">
    <text x="450" y="34" font-weight="600">Tap badge</text>
    <text x="450" y="50" fill="#7b8794">A node with a name is a `name:` in the YAML,</text>
    <text x="450" y="64" fill="#7b8794">which is what makes it addressable as an `input:`.</text>

    <text x="450" y="82" font-weight="600">Thumbnail = the tap</text>
    <text x="450" y="98" fill="#7b8794">`ctx.taps[name]` already holds exactly this image.</text>
    <text x="450" y="112" fill="#7b8794">The preview is a downscale, not a second render.</text>

    <text x="450" y="204" font-weight="600">The hard part</text>
    <text x="450" y="220" fill="#7b8794">Stages that carry state — flow, mog2, knn,</text>
    <text x="450" y="234" fill="#7b8794">frame_diff, mean_background — cannot be</text>
    <text x="450" y="248" fill="#7b8794">reconfigured in place. Rebuilding one drops its</text>
    <text x="450" y="262" fill="#7b8794">history, so the preview jumps. goncanalyser's</text>
    <text x="450" y="276" fill="#7b8794">`_key()` guard is the existing answer: rebuild</text>
    <text x="450" y="290" fill="#7b8794">only when a *construction* parameter changed,</text>
    <text x="450" y="304" fill="#7b8794">and keep per-frame knobs live.</text>
  </g>
</svg>
