<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>How the parameter form is generated, and how live knobs are told from construction ones</title>
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
  </defs>
  <rect width="920" height="430" fill="#f5f7fa"/>

  <text x="24" y="26" font-size="13" font-weight="600" fill="#3e4c59">The stage class</text>
  <text x="404" y="26" font-size="13" font-weight="600" fill="#3e4c59">The form</text>
  <text x="620" y="26" font-size="13" font-weight="600" fill="#3e4c59">What an edit does</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <rect x="24" y="38" width="344" height="196" rx="6" fill="#1f2933"/>
    <text x="38" y="60" fill="#9fb3c8">@register("stage", "farneback")</text>
    <text x="38" y="78" fill="#e8eef5">class Farneback:</text>
    <text x="38" y="96" fill="#e8eef5">    def __init__(self, pyr_scale=0.5,</text>
    <text x="38" y="112" fill="#e8eef5">            levels=3, winsize=15,</text>
    <text x="38" y="128" fill="#e8eef5">            iterations=3, gain=32.0):</text>
    <text x="38" y="150" fill="#8fd14f">        self.gain = float(gain)</text>
    <text x="38" y="166" fill="#616e7c">        # ... and every other knob</text>
    <text x="38" y="188" fill="#f0b429">        self._history = _Previous()</text>
    <text x="38" y="212" fill="#616e7c">    # nothing else to declare: the</text>
    <text x="38" y="226" fill="#616e7c">    # editor reads the signature</text>
  </g>

  <path d="M372 130 H396" stroke="#7b8794" stroke-width="1.6" fill="none" marker-end="url(#p-arrow)"/>
  <text x="330" y="256" font-size="10" fill="#7b8794">inspect.signature</text>

  <g transform="translate(404 38)">
    <rect width="180" height="196" rx="6" fill="#fff" stroke="#cbd2d9"/>
    <text x="12" y="22" font-size="11" font-weight="600" fill="#1f2933">farneback</text>
    <g font-size="10">
      <text x="12" y="46" fill="#52606d">pyr_scale</text>
      <rect x="12" y="52" width="156" height="17" rx="3" fill="#f5f7fa" stroke="#cbd2d9"/><text x="19" y="64" fill="#1f2933">0.500</text>
      <text x="12" y="86" fill="#52606d">levels</text>
      <rect x="12" y="92" width="156" height="17" rx="3" fill="#f5f7fa" stroke="#cbd2d9"/><text x="19" y="104" fill="#1f2933">3</text>
      <text x="12" y="126" fill="#52606d">winsize</text>
      <rect x="12" y="132" width="156" height="17" rx="3" fill="#f5f7fa" stroke="#cbd2d9"/><text x="19" y="144" fill="#1f2933">21</text>
      <text x="12" y="166" fill="#b44d12" font-weight="600">gain</text>
      <rect x="12" y="172" width="156" height="17" rx="3" fill="#fdf3d8" stroke="#f0b429"/><text x="19" y="184" fill="#1f2933">160</text>
    </g>
  </g>
  <text x="404" y="252" font-size="10" fill="#7b8794">A row writes its key into the YAML only when it</text>
  <text x="404" y="266" font-size="10" fill="#7b8794">differs from the default, and deletes it when it</text>
  <text x="404" y="280" font-size="10" fill="#7b8794">goes back — so a terse config stays terse.</text>

  <g transform="translate(620 38)">
    <rect width="276" height="92" rx="6" fill="#fff" stroke="#1f8a70"/>
    <text x="14" y="22" font-size="11" font-weight="600" fill="#1f8a70">live — assigned to the running stage</text>
    <text x="14" y="42" font-size="10" fill="#52606d">`gain` is an attribute the stage reads every</text>
    <text x="14" y="56" font-size="10" fill="#52606d">frame, so the editor assigns it. The flow</text>
    <text x="14" y="70" font-size="10" fill="#52606d">history behind `_history` is untouched, and a</text>
    <text x="14" y="84" font-size="10" fill="#52606d">paused frame simply re-renders brighter.</text>

    <rect y="106" width="276" height="106" rx="6" fill="#fff" stroke="#f0b429"/>
    <text x="14" y="128" font-size="11" font-weight="600" fill="#b44d12">construction — rebuilds the stage</text>
    <text x="14" y="148" font-size="10" fill="#52606d">`mog2.history` is swallowed by the OpenCV</text>
    <text x="14" y="162" font-size="10" fill="#52606d">subtractor and leaves no attribute behind, so</text>
    <text x="14" y="176" font-size="10" fill="#52606d">it cannot be assigned. The editor builds a new</text>
    <text x="14" y="190" font-size="10" fill="#52606d">stage — and says so, because the model it had</text>
    <text x="14" y="204" font-size="10" fill="#52606d">learnt is gone.</text>
  </g>

  <g transform="translate(24 296)">
    <rect width="872" height="112" rx="6" fill="#fff" stroke="#cbd2d9"/>
    <text x="16" y="26" font-size="12" font-weight="600" fill="#3e4c59">The rule, in one line</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <text x="16" y="52" fill="#1f2933">live  ⟺  hasattr(instance, parameter)</text>
    </g>
    <text x="16" y="76" font-size="11" fill="#52606d">Derived, not maintained: a parameter a stage still needs at run time is a parameter it kept. Adding a stage</text>
    <text x="16" y="92" font-size="11" fill="#52606d">classifies itself. One class opts out — `StaticMask.RECONSTRUCT`, because it stores `threshold` but caches the mask it fitted from it.</text>
  </g>
</svg>
