<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" width="700" height="640" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>The same launcher at night — it opens in whichever theme the editor was last left in</title>
  <defs>
    <linearGradient id="ld-mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/><stop offset="45%" stop-color="#6ea8fe"/><stop offset="100%" stop-color="#4fd1a5"/>
    </linearGradient>
    <clipPath id="ld-tile"><rect x="94" y="160" width="256" height="256" rx="56"/></clipPath>
  </defs>
  <rect width="700" height="640" fill="#171e26"/>

  <path d="M 30 48 v -22 a 6 6 0 0 1 6 -6 h 628 a 6 6 0 0 1 6 6 v 22 z" fill="#171e26" stroke="#3e4c59"/>
  <text x="350" y="40" font-size="11" fill="#7b8794" text-anchor="middle">segmentator</text>
  <path d="M 30 48 v 494 a 6 6 0 0 0 6 6 h 628 a 6 6 0 0 0 6 -6 v -494 z" fill="#1f2933" stroke="#3e4c59"/>

  <line x1="410" y1="59" x2="410" y2="537" stroke="#2b3743"/>

  <!-- The icon is one asset, not two: it is a dark tile in both themes, which is
       why it needs no night twin the way the palette's accents do. -->
  <g clip-path="url(#ld-tile)">
    <rect x="94" y="160" width="256" height="256" fill="#0b0e12"/>
    <circle cx="222" cy="288" r="94" fill="url(#ld-mark)"/>
    <circle cx="222" cy="288" r="43" fill="#12161c"/>
    <circle cx="209" cy="274" r="12" fill="#e8eef5"/>
  </g>

  <text x="54" y="528" font-size="12" fill="#7b8794">version: 0.1.0</text>

  <g font-size="12">
    <rect x="458" y="264" width="160" height="30" rx="4" fill="#171e26" stroke="#3e4c59"/>
    <text x="538" y="283" fill="#cbd2d9" text-anchor="middle">New Project</text>
    <rect x="458" y="306" width="160" height="30" rx="4" fill="#171e26" stroke="#3e4c59"/>
    <text x="538" y="325" fill="#cbd2d9" text-anchor="middle">Open Project</text>
  </g>

  <g transform="translate(30 574)" font-size="11">
    <text x="0" y="11" fill="#9fb3c8">The theme is the one key the editor remembers between runs, so the launcher is the first thing to show it —</text>
    <text x="0" y="27" fill="#9fb3c8">it has no toggle of its own, and there is nothing on it yet whose colour would carry a meaning to preserve.</text>
  </g>
</svg>
