<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Anatomy of a pipeline: source, stages, sinks, and the context that travels with a frame</title>
  <defs>
    <marker id="a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
    <marker id="a-thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a70"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#f5f7fa"/>
  <text x="24" y="26" font-size="13" font-weight="600" fill="#3e4c59">source → stages → sinks, once per frame</text>

  <g transform="translate(24 44)" font-size="11">
    <rect width="104" height="38" rx="5" fill="#fff" stroke="#52606d" stroke-width="1.5"/>
    <text x="14" y="24" fill="#1f2933">video</text>
    <path d="M112 63 H136" stroke="#7b8794" stroke-width="1.6" fill="none" marker-end="url(#a-arrow)" transform="translate(0 -44)"/>
  </g>

  <g transform="translate(168 44)" font-size="11">
    <rect width="500" height="38" rx="5" fill="#fff" stroke="#cbd2d9"/>
    <g fill="#3e4c59">
      <text x="16" y="24">gray</text>
      <text x="86" y="24">median_blur</text>
      <text x="196" y="24">static_mask</text>
      <text x="306" y="24">mean_background</text>
      <text x="432" y="24">apply_mask</text>
    </g>
    <g stroke="#cbd2d9"><line x1="76" y1="6" x2="76" y2="32"/><line x1="186" y1="6" x2="186" y2="32"/><line x1="296" y1="6" x2="296" y2="32"/><line x1="422" y1="6" x2="422" y2="32"/></g>
  </g>
  <path d="M676 63 H708" stroke="#7b8794" stroke-width="1.6" fill="none" marker-end="url(#a-arrow)"/>

  <g transform="translate(716 34)" font-size="11" fill="#1f8a70">
    <rect width="180" height="20" rx="4" fill="#eafaf3"/><text x="10" y="14">ffmpeg   ← image</text>
    <rect y="26" width="180" height="20" rx="4" fill="#eafaf3"/><text x="10" y="40">display  ← mask</text>
    <rect y="52" width="180" height="20" rx="4" fill="#eafaf3"/><text x="10" y="66">csv      ← ctx.rows</text>
    <rect y="78" width="180" height="20" rx="4" fill="#eafaf3"/><text x="10" y="92">json     ← ctx.metrics</text>
  </g>

  <!-- Ctx -->
  <g transform="translate(24 152)">
    <rect width="644" height="246" rx="6" fill="#fff" stroke="#cbd2d9"/>
    <text x="16" y="26" font-size="12" font-weight="600" fill="#3e4c59">Ctx — one per frame, handed down the chain</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <text x="16" y="54" fill="#1f2933">image</text>
      <text x="16" y="78" fill="#1f2933">source</text>
      <text x="16" y="102" fill="#1f2933">index</text>
      <text x="16" y="126" fill="#1f2933">store</text>
      <text x="16" y="150" fill="#1f2933">taps</text>
      <text x="16" y="174" fill="#1f2933">metrics</text>
      <text x="16" y="198" fill="#1f2933">rows</text>
    </g>
    <g font-size="11" fill="#52606d">
      <text x="96" y="54">the working array — a stage rebinds it, never mutates it</text>
      <text x="96" y="78">the original BGR frame, untouched by anything</text>
      <text x="96" y="102">the frame number</text>
      <text x="96" y="126">side channel within one frame: `mask`, `heat`, `boxes`</text>
      <text x="96" y="150">a named stage's output, kept for a sink to pick from</text>
      <text x="96" y="174">per-frame scalars — what the json sink writes</text>
      <text x="96" y="198">per-object detail — what the csv and crops sinks write</text>
    </g>
    <line x1="16" y1="212" x2="628" y2="212" stroke="#e4e7eb"/>
    <text x="16" y="232" font-size="11" fill="#7b8794">Two kinds of state, deliberately apart: what survives the frame lives on the stage instance, what does not lives in `store`.</text>
  </g>

  <g transform="translate(688 152)">
    <rect width="208" height="246" rx="6" fill="#fff" stroke="#cbd2d9"/>
    <text x="14" y="24" font-size="12" font-weight="600" fill="#3e4c59">Why a side channel</text>
    <text x="14" y="46" font-size="11" fill="#52606d">A plain `ndarray -&gt; ndarray`</text>
    <text x="14" y="62" font-size="11" fill="#52606d">chain cannot express what the</text>
    <text x="14" y="78" font-size="11" fill="#52606d">gas recipe needs:</text>
    <text x="14" y="104" font-size="11" fill="#1f2933">`mean_background` accumulates</text>
    <text x="14" y="120" font-size="11" fill="#1f2933">the masked frame but subtracts</text>
    <text x="14" y="136" font-size="11" fill="#1f2933">from the unmasked one.</text>
    <text x="14" y="162" font-size="11" fill="#52606d">`static_mask` writes the mask,</text>
    <text x="14" y="178" font-size="11" fill="#52606d">two later stages read it, and</text>
    <text x="14" y="194" font-size="11" fill="#52606d">the frame carries on unchanged.</text>
    <text x="14" y="224" font-size="11" fill="#7b8794">Nothing branches on runtime</text>
    <text x="14" y="238" font-size="11" fill="#7b8794">state; there is no state machine.</text>
  </g>
</svg>
